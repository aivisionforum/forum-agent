<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Forum Agent — Insights</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b0f14; color: #f2f5f7; font-family: -apple-system,
         "PingFang SC", sans-serif; min-height: 100vh; padding: 28px 36px; }
  #head { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 1px solid #1c2530; padding-bottom: 10px; }
  h1 { font-size: 20px; font-weight: 600; }
  #conv { font-size: 20px; color: #6ea8fe; margin: 14px 0 22px;
          min-height: 26px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .sec h2 { font-size: 17px; color: #7f8c99; margin-bottom: 10px;
            text-transform: none; }
  .item { background: #121922; border: 1px solid #1c2530; border-radius: 8px;
          padding: 12px 14px; margin-bottom: 10px; position: relative; }
  .item .zh { font-size: 19px; line-height: 1.4; }
  .item .en { font-size: 15px; color: #a8b8a8; margin-top: 4px; }
  .badge { position: absolute; top: 8px; right: 10px; font-size: 11px;
           padding: 2px 8px; border-radius: 10px; }
  .draft .badge { background: #78350f; color: #fcd34d; }
  .approved .badge { background: #14532d; color: #86efac; }
  .new .badge { background: #1e3a8a; color: #93c5fd; }
  .hidden-item { display: none; }
  .ops button { font-size: 12px; margin: 8px 6px 0 0; padding: 4px 10px;
                border-radius: 6px; border: 1px solid #2a3a4d; cursor: pointer;
                background: #18222e; color: #cbd5e1; }
  #meta { color: #556; font-size: 13px; }
  /* Projector: lock to one screen — content is auto-zoomed to fit, never
     scrolled (a wall display cannot be scrolled by anyone). */
  body.projector { height: 100vh; overflow: hidden; }
  .page { font-size: 13px; color: #556; margin-left: 8px; }
</style>
</head>
<body>
<div id="head"><h1>洞察面板 · Insight Panel</h1><span id="meta"></span></div>
<div id="viewbar" style="font-size:13px;color:#7f8c99;margin-top:6px"></div>
<div id="conv"></div>
<div id="empty" style="display:none;color:#7f8c99;font-size:20px;margin:60px 0;text-align:center;line-height:1.8"></div>
<div class="grid">
  <div class="sec" id="sec-summary_points"><h2>要点摘要 · Key points
    <span class="page" id="page-summary_points"></span></h2>
    <div id="summary_points"></div></div>
  <div class="sec" id="sec-next_steps"><h2>行动项 · Next steps
    <span class="page" id="page-next_steps"></span></h2>
    <div id="next_steps"></div></div>
  <div class="sec" id="sec-emerging_consensus"><h2>正在形成的共识 · Emerging consensus
    <span class="page" id="page-emerging_consensus"></span></h2>
    <div id="emerging_consensus"></div></div>
  <div class="sec" id="sec-tensions"><h2>主要分歧 · Tensions
    <span class="page" id="page-tensions"></span></h2>
    <div id="tensions"></div></div>
  <div class="sec" id="sec-open_questions"><h2>待回答的问题 · Open questions
    <span class="page" id="page-open_questions"></span></h2>
    <div id="open_questions"></div></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const room = params.get("room") || "room1";
const operator = params.get("operator") === "1";
if (!operator) document.body.classList.add("projector");
// Projector layout: zoom-to-fit first; if content cannot fit at readable
// size, overflowing sections page-flip like an airport board (nobody can
// scroll a wall display).
const PAGE = 3;              // items shown at once in a flipping section
const MIN_READABLE = 0.9;    // never shrink below this just to avoid flipping
let paging = false, pageTick = 0;
function zoomFit(floor) {
  let z = 1.4;
  document.body.style.zoom = z;
  const fits = () =>
      document.documentElement.scrollHeight <= window.innerHeight &&
      document.documentElement.scrollWidth <= window.innerWidth;
  while (z > floor && !fits()) { z -= 0.05; document.body.style.zoom = z; }
  return fits();
}
function fitToScreen() {
  if (operator) return;
  for (const kind of KINDS) {
    const box = document.getElementById(kind);
    document.getElementById("sec-" + kind).style.display =
      (OPTIONAL.includes(kind) && !box.children.length) ? "none" : "";
    for (const el of box.children) el.style.display = "";
    document.getElementById("page-" + kind).textContent = "";
  }
  paging = !zoomFit(MIN_READABLE);
  if (!paging) return;
  for (const kind of KINDS) {
    const els2 = [...document.getElementById(kind).children];
    if (els2.length <= PAGE) continue;
    const pages = Math.ceil(els2.length / PAGE);
    const pi = pageTick % pages;
    els2.forEach((el, i) => el.style.display =
      (i >= pi * PAGE && i < (pi + 1) * PAGE) ? "" : "none");
    document.getElementById("page-" + kind).textContent = `${pi + 1}/${pages}`;
  }
  zoomFit(0.55);  // pages are small; this normally fits well above the floor
}
setInterval(() => { if (paging && !operator) { pageTick++; fitToScreen(); } },
            8000);
window.addEventListener("resize", fitToScreen);
const session = params.get("session") || "";
const KINDS = ["summary_points","next_steps","emerging_consensus","tensions","open_questions"];
const OPTIONAL = KINDS.slice(1);  // Key points always shows; the rest only when non-empty (projector)
const esc = (t) => String(t ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let interval = 180, engineError = "";

function render(s) {
  for (const kind of KINDS) {
    const box = document.getElementById(kind);
    box.innerHTML = "";
    for (const it of (s.items?.[kind] || [])) {
      if (it.status === "hidden" && !operator) continue;
      const d = document.createElement("div");
      const isNew = it.added && s.updated && (s.updated - it.added) < 5;
      d.className = "item " + (isNew ? "new" : it.status === "approved" ? "approved" : "draft");
      const badge = isNew ? "NEW 新" : it.status === "approved" ? "✓" : "DRAFT 草稿";
      d.innerHTML = `<span class="badge">${badge}</span>
        <div class="zh">${esc(it.zh)}</div><div class="en">${esc(it.en)}</div>`;
      if (operator && !session) {
        const ops = document.createElement("div");
        ops.className = "ops";
        for (const [label, action] of [["✓ approve","approved"],
            ["draft","draft"], ["✕ hide","hidden"], ["✎ edit","edit"]]) {
          const b = document.createElement("button");
          b.textContent = label;
          b.onclick = async () => {
            const body = {room, id: it.id, action};
            if (action === "edit") {
              const zh = prompt("中文:", it.zh); if (zh === null) return;
              const en = prompt("English:", it.en); if (en === null) return;
              body.zh = zh; body.en = en;
            }
            render(await (await fetch("/api/insights/item", {
              method: "POST", headers: {"Content-Type": "application/json"},
              body: JSON.stringify(body)})).json());
          };
          ops.appendChild(b);
        }
        d.appendChild(ops);
      }
      box.appendChild(d);
    }
  }
  // Empty panel must explain itself: say what the system is doing and when
  // content will appear, or a viewer assumes it is broken.
  const total = KINDS.reduce((n, k) =>
    n + document.getElementById(k).children.length, 0);
  const emptyEl = document.getElementById("empty");
  emptyEl.style.display = total ? "none" : "";
  if (!total) emptyEl.innerHTML = s.archived
    ? "该会话尚无洞察 — 在控制台勾选该会话并点击 Summarize now<br>No insights stored for this session — check it in the console and click Summarize now"
    : s.busy
      ? `✦ AI 正在总结讨论内容，约需 30–60 秒…<br>Summarizing the discussion now — about 30–60 seconds (running ${s.busy.seconds}s)`
      : "首次摘要将在会议开始约 3 分钟后自动出现，之后每 3 分钟更新<br>The first summary appears about 3 minutes into the session, then updates every 3 minutes";
  const c = s.convergence_line || {};
  document.getElementById("conv").textContent =
    c.zh ? `▶ ${c.zh} · ${c.en}` : "";
  lastUpdated = s.updated || 0;
  interval = s.interval || interval;
  engineError = s.error || "";
  tickMeta();
  fitToScreen();
}

async function load() {
  render(await (await fetch(`/api/insights?room=${room}&session=${session}`)).json());
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/room/${room}`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "insights") render(m);
    if (m.type === "session_reset") load();
  };
  ws.onclose = () => setTimeout(connect, 1500);
  window._ws = ws;
}
setInterval(() => { if (window._ws && window._ws.readyState === 1) window._ws.send("ping"); }, 15000);
if (session) {
  document.getElementById("viewbar").innerHTML =
    "ARCHIVED SESSION " + session + " (read-only)";
} else document.getElementById("viewbar").innerHTML = operator
  ? "OPERATOR VIEW — approve/hide buttons active · <a style='color:#6ea8fe' href='?room=" + room + "'>switch to projector view</a>"
  : "PROJECTOR VIEW (read-only) · <a style='color:#6ea8fe' href='?room=" + room + "&operator=1'>switch to operator view</a>";
let lastUpdated = 0;
function tickMeta() {
  const el = document.getElementById("meta");
  if (!lastUpdated) { el.textContent = "waiting for first refresh…"; return; }
  const next = Math.max(0, interval - (Date.now()/1000 - lastUpdated));
  el.textContent = (engineError ? "⚠ " + engineError + " · " : "")
    + "updated " + new Date(lastUpdated * 1000).toLocaleTimeString()
    + (session ? "" : ` · next auto-update in ${Math.floor(next/60)}:${String(Math.floor(next%60)).padStart(2,"0")}`);
  el.style.color = engineError ? "#f87171" : "";
}
setInterval(tickMeta, 1000);
load(); if (!session) { connect(); setInterval(load, 10000); }
</script>
</body>
</html>
