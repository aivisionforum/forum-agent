<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Forum Agent — Live Subtitles</title>
<style>
  :root { --fs: 34px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b0f14; color: #f2f5f7; font-family: -apple-system,
         "PingFang SC", "Helvetica Neue", sans-serif; height: 100vh;
         display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 10px 24px; font-size: 16px; color: #7f8c99;
            border-bottom: 1px solid #1c2530; display: flex;
            justify-content: space-between; }
  #status.live { color: #3ddc84; }
  #feed { flex: 1; overflow-y: auto; padding: 20px 40px 30vh; }
  .entry { margin-bottom: 26px; max-width: 1500px; }
  .meta { font-size: 18px; color: #6ea8fe; margin-bottom: 4px; }
  .orig { font-size: var(--fs); font-weight: 600; line-height: 1.35; }
  .trans { font-size: calc(var(--fs) * 0.82); color: #a8b8a8;
           line-height: 1.35; margin-top: 4px; }
  .partial .orig { color: #c9d4dd; font-weight: 400; font-style: italic; }
</style>
</head>
<body>
<div id="header">
  <span id="room-label"></span>
  <span id="status">connecting…</span>
</div>
<div id="feed"></div>
<script>
const params = new URLSearchParams(location.search);
const room = params.get("room") || "room1";
const fs = params.get("fs");
if (fs) document.documentElement.style.setProperty("--fs", fs + "px");
document.getElementById("room-label").textContent = "Room: " + room;
const feed = document.getElementById("feed");
const esc = (t) => String(t ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const statusEl = document.getElementById("status");
let partialEl = null;
const finals = {};   // id -> entry element, so translations can attach later

function entryHtml(m, partial) {
  const t = new Date(m.t_start * 1000).toISOString().substr(14, 5);
  return `<div class="meta">${esc(m.speaker_id) || "…"} · ${t} · ${esc(m.lang)}</div>
          <div class="orig">${esc(m.text)}</div>` +
         (partial ? "" : `<div class="trans">${esc(m.translation)}</div>`);
}
function scrollDown() { feed.scrollTop = feed.scrollHeight; }

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/room/${room}`);
  window._ws = ws;
  ws.onopen = () => { statusEl.textContent = "● LIVE"; statusEl.className = "live"; };
  ws.onclose = () => { statusEl.textContent = "reconnecting…";
                       statusEl.className = ""; setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "session_reset") {
      feed.innerHTML = ""; partialEl = null;
      for (const k in finals) delete finals[k];
      return;
    }
    if (m.type === "partial") {
      if (!partialEl) { partialEl = document.createElement("div");
                        partialEl.className = "entry partial";
                        feed.appendChild(partialEl); }
      partialEl.innerHTML = entryHtml(m, true);
    } else if (m.type === "final") {
      if (partialEl) { partialEl.remove(); partialEl = null; }
      const el = document.createElement("div");
      el.className = "entry"; el.innerHTML = entryHtml(m, false);
      feed.appendChild(el); finals[m.id] = el;
    } else if (m.type === "translation" && finals[m.id]) {
      finals[m.id].querySelector(".trans").textContent = m.translation;  // textContent: safe
    }
    scrollDown();
  };
}
connect();
setInterval(() => { if (window._ws && window._ws.readyState === 1) window._ws.send("ping"); }, 15000);
</script>
</body>
</html>
