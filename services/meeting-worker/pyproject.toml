[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forum-meeting-worker"
version = "0.1.0"
description = "Local Forum meeting worker protocol bootstrap"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
forum-meeting-worker = "forum_meeting_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
